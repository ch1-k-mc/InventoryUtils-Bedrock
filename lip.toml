format = 4
id = "github.com/ch1-k-mc/InventoryUtils-Bedrock"
version = "0.1.0"

[info]
name = "Inventory Utils"
description = "An unofficial Bedrock Edition (LeviLamina) port of the Java Edition mods Item Scroller and Inventory Profiles Next, with Crafting Tools-style features and hotbar favorites."
tags = ["platform:levilamina", "type:mod", "client", "utility", "inventory"]
logo = "https://raw.githubusercontent.com/ch1-k-mc/InventoryUtils-Bedrock/main/docs/images/icon.png"

# Client only. LeviLamina 26.60 has no "client" variant: the entry is picked by side.
[[variants.""]]
side = "client"
platform = "win-x64"
preserve = ["mods/InventoryUtils/config/**"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/InventoryUtils-client-windows-x64.zip"]
place = [{ src = "InventoryUtils/", dest = "mods/InventoryUtils/" }]
